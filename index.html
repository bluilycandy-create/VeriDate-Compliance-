<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriDate Compliance - 效期標示合規稽核面板</title>
  <meta name="description" content="VeriDate Compliance 是一款日系簡約文青風的食品效期標示合規分析工具。提供製造日期分析、比對實際標示與應標效期，並支援圖卡與清單雙重檢視，提供優雅精緻的稽核報告。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Retro Paper Dot Texture Overlay -->
  <div class="texture-overlay" id="paperTextureOverlay"></div>

  <div class="app-container">
    
    <!-- Header Section - Magazine Style -->
    <header>
      <div class="logo-section">
        <div class="logo-icon" id="logoIconContainer">
          <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
        </div>
        <div>
          <h1 id="appMainTitle">VeriDate Compliance</h1>
          <p id="appSubtitle">食品標示效期合規性稽核系統</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" id="loadDefaultBtn">
          <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i> 載入預設資料
        </button>
        <button class="btn btn-success" id="exportBtn">
          <i data-lucide="download" style="width: 16px; height: 16px;"></i> 匯出稽核報告
        </button>
      </div>
    </header>

    <!-- Upload/Drop Zone Panel -->
    <section class="upload-section">
      <div class="paper-panel drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
        <div class="upload-icon" id="uploadIconElement">
          <i data-lucide="upload-cloud" style="width: 40px; height: 40px;"></i>
        </div>
        <h3 id="uploadTitleText">拖曳您需要稽核的 CSV 檔案至此處</h3>
        <p id="uploadSubtitleText">或者點擊此區域選取檔案進行批次合規性稽核 (支援多種日期格式自動解析)</p>
        <div>
          <span style="font-size: 0.75rem; color: var(--text-muted); font-family: 'Noto Serif TC', serif;">
            欄位格式規格：批號、品項、製造日期、應標效期、實標效期
          </span>
        </div>
      </div>
    </section>

    <!-- Metrics Cards Grid -->
    <section class="metrics-grid" id="metricsGridSection">
      
      <div class="paper-panel metric-card total" id="metricCardTotal">
        <div class="metric-header">
          <span>總檢查筆數</span>
          <i data-lucide="list-ordered" style="width: 16px; height: 16px; color: var(--primary);"></i>
        </div>
        <div class="metric-value" id="metricTotal">0</div>
      </div>

      <div class="paper-panel metric-card compliance-rate" id="metricCardRate">
        <div class="metric-header">
          <span>標示合規率</span>
          <i data-lucide="percent" style="width: 16px; height: 16px; color: var(--success);"></i>
        </div>
        <div class="metric-value" id="metricCompliance">0%</div>
      </div>

      <div class="paper-panel metric-card compliant" id="metricCardCompliant">
        <div class="metric-header">
          <span>合規筆數</span>
          <i data-lucide="check-circle-2" style="width: 16px; height: 16px; color: var(--success);"></i>
        </div>
        <div class="metric-value" id="metricCompliant">0</div>
      </div>

      <div class="paper-panel metric-card violations" id="metricCardViolations">
        <div class="metric-header">
          <span>標示異常筆數</span>
          <i data-lucide="alert-triangle" style="width: 16px; height: 16px; color: var(--danger);"></i>
        </div>
        <div class="metric-value" id="metricViolations">0</div>
      </div>

    </section>

    <!-- Charts Section -->
    <section class="charts-section" id="chartsSectionContainer">
      
      <div class="paper-panel chart-container" id="complianceRatioChartPanel">
        <div class="chart-header">
          <h3>合規分佈比例</h3>
        </div>
        <div class="chart-wrapper">
          <canvas id="statusChart"></canvas>
        </div>
      </div>

      <div class="paper-panel chart-container" id="errorTypesChartPanel">
        <div class="chart-header">
          <h3>異常原因類型統計</h3>
        </div>
        <div class="chart-wrapper">
          <canvas id="errorTypeChart"></canvas>
        </div>
      </div>

    </section>

    <!-- Data Records Panel -->
    <section class="data-section" id="dataRecordsPanel">
      <div class="paper-panel">
        
        <!-- View Toggle Control Row -->
        <div class="view-control-row" id="viewControlRowContainer">
          <h2 class="serif-font" style="font-size: 1.35rem; font-weight: 700;">合規稽核明細</h2>
          <div class="view-toggle-container" id="viewToggleControlBox">
            <button class="view-toggle-btn active" id="viewToggleTable">
              <i data-lucide="list" style="width: 14px; height: 14px;"></i> 列表檢視
            </button>
            <button class="view-toggle-btn" id="viewToggleCards">
              <i data-lucide="layout-grid" style="width: 14px; height: 14px;"></i> 圖卡檢視
            </button>
          </div>
        </div>

        <!-- Filters & Search -->
        <div class="table-header-controls">
          <div class="search-wrapper">
            <i data-lucide="search" class="search-icon" style="width: 16px; height: 16px;"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋批號、品項或日期...">
          </div>
          
          <div class="filter-btn-group" id="filterTabButtonGroup">
            <button class="filter-tab active" data-filter="all" id="filterTabAll">全部</button>
            <button class="filter-tab" data-filter="compliant" id="filterTabCompliant">合規</button>
            <button class="filter-tab" data-filter="violations" id="filterTabViolations">不合規</button>
            <button class="filter-tab" data-filter="mismatch" id="filterTabMismatch">效期不符</button>
            <button class="filter-tab" data-filter="missing" id="filterTabMissing">資料缺失</button>
            <button class="filter-tab" data-filter="duplicate" id="filterTabDuplicate">重複上報</button>
          </div>
        </div>

        <!-- 1. LIST VIEW (Default Table) -->
        <div class="table-wrapper" id="dataTableWrapper">
          <table>
            <thead>
              <tr>
                <th style="width: 15%;">批號</th>
                <th style="width: 25%;">品項</th>
                <th style="width: 18%;">製造日期</th>
                <th style="width: 10%;">應標效期</th>
                <th style="width: 10%;">實標效期</th>
                <th style="width: 22%;">稽核結果 & 說明</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>

        <!-- 2. CARDS VIEW (Polaroid Grid, Hidden by default) -->
        <div class="cards-grid" id="dataCardsWrapper" style="display: none;">
          <!-- Dynamically populated product cards -->
        </div>

        <!-- Pagination -->
        <div class="pagination-container" id="tablePaginationContainer">
          <div class="pagination-info" id="paginationInfo">顯示 0 - 0 / 共 0 筆</div>
          <div class="pagination-controls">
            <button class="btn btn-secondary" id="prevPageBtn" disabled>
              <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i> 上一頁
            </button>
            <button class="btn btn-secondary" id="nextPageBtn" disabled>
              下一頁 <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- Lucide Icons & Chart.js CDNs -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Dashboard Main Logic -->
  <script src="app.js"></script>
</body>
</html>
